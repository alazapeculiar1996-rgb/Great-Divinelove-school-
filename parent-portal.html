<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parent Portal - Great Divinelove School</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f8ff;
    color: #123;
}

header {
    background: #008ed6;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
    color: #005b96;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    background: #005b96;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #005b96;
}
</style>
</head>

<body>

<header>
    <h1>Great Divinelove Nursery and Primary School</h1>
    <p>Parent Portal</p>
    <p>Wisdom from God</p>
</header>

<div class="container">

<div class="card">

<h2>Parent Login</h2>

<p>
Welcome to the Great Divinelove School Parent Portal.
</p>

<label>Parent Email</label>
<input type="email" placeholder="Enter your email">

<label>Password</label>
<input type="password" placeholder="Enter your password">

<button type="button">Login</button>
    <p style="text-align:center; margin-top:20px;">
New Parent? <a href="#">Create Account</a>
    </p>

<a class="back" href="index.html">← Back to School Website</a>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parent Registration - Great Divinelove School</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f8ff;
    color: #123;
}

header {
    background: #008ed6;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
    color: #005b96;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    background: #005b96;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #005b96;
}
</style>
</head>

<body>

<header>
    <h1>Great Divinelove Nursery and Primary School</h1>
    <p>Parent Registration</p>
    <p>Wisdom from God</p>
</header>

<div class="container">

<div class="card">

<h2>Create Parent Account</h2>

<p>
Please register to access the Great Divinelove School Parent Portal.
</p>

<label>Parent/Guardian Name</label>
<input type="text" placeholder="Enter your full name">

<label>Phone Number</label>
<input type="tel" placeholder="Enter your phone number">

<label>Email Address</label>
<input type="email" placeholder="Enter your email">

<label>Password</label>
<input type="password" placeholder="Create a password">

<label>Confirm Password</label>
<input type="password" placeholder="Confirm your password">

<button type="button">Create Account</button>

<a class="back" href="parent-portal.html">← Back to Parent Login</a>

</div>

</div>

</body>
</html>

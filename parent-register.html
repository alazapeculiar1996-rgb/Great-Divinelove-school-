<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Parent Registration - Great Divinelove School</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f8ff;
    color: #123;
}

header {
    background: #008ed6;
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.container {
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
    color: #005b96;
}

label {
    display: block;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    background: #005b96;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
}

button:disabled {
    background: #999;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #005b96;
}
</style>
</head>

<body>

<header>
    <h1>Great Divinelove Nursery and Primary School</h1>
    <p>Parent Registration</p>
    <p>Wisdom from God</p>
</header>

<div class="container">

<div class="card">

<h2>Create Parent Account</h2>

<p>
Please register to access the Great Divinelove School Parent Portal.
</p>

<label>Parent/Guardian Name</label>
<input id="fullName" type="text" placeholder="Enter your full name">

<label>Phone Number</label>
<input id="phone" type="tel" placeholder="Enter your phone number">

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter your email">

<label>Password</label>
<input id="password" type="password" placeholder="Create a password">

<label>Confirm Password</label>
<input id="confirmPassword" type="password" placeholder="Confirm your password">

<button id="registerButton" type="button">
Create Account
</button>

<div id="message" class="message"></div>

<p style="text-align:center; margin-top:20px;">
Already have an account?
<a href="parent-portal.html">Login</a>
</p>

<a class="back" href="index.html">
← Back to School Website
</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://zojuenxfeswlmvrhbzib.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_mY2UJ2aw7Oh-Ffs-LZoJFw_3W6-9G0Q";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("registerButton").addEventListener("click", async function () {

    const fullName = document.getElementById("fullName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    message.textContent = "";

    if (!fullName || !phone || !email || !password || !confirmPassword) {
        message.textContent = "Please fill in all the fields.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    button.disabled = true;
    button.textContent = "Creating Account...";

    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: fullName,
                phone: phone
            },
            emailRedirectTo:
                "https://alazapeculiar1996-rgb.github.io/Great-Divinelove-school-/parent-portal.html"
        }
    });

    if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Create Account";
        return;
    }

    message.textContent =
        "Registration successful! Please check your email and confirm your account before logging in.";

    button.disabled = false;
    button.textContent = "Account Created";
});

</script>

</body>
</html>
